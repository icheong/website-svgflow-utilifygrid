<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fluid SVG Wave Background Generator</title>
    <link href="./style.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="text-slate-200 antialiased h-screen w-screen flex overflow-hidden">
    
    <!-- Sidebar Controls -->
    <aside class="glass-panel w-80 h-full flex flex-col shadow-2xl relative z-10 shrink-0">
      <div class="p-6 border-b border-white/10">
        <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">
          Fluid SVG Flow
        </h1>
        <p class="text-xs text-slate-400 mt-1">High-Performance Wave Generator</p>
      </div>

      <div class="p-6 flex-1 overflow-y-auto space-y-8 flex flex-col">
        <!-- Number of Waves -->
        <div class="space-y-2">
          <div class="flex justify-between">
            <label class="text-sm font-medium text-slate-300">Number of Waves</label>
            <span id="wavesVal" class="text-xs font-bold text-emerald-400">3</span>
          </div>
          <input type="range" id="waveCount" min="1" max="3" value="3" class="w-full">
        </div>

        <!-- Animation Speed -->
        <div class="space-y-2">
          <div class="flex justify-between">
            <label class="text-sm font-medium text-slate-300">Animation Speed</label>
            <span id="speedVal" class="text-xs font-bold text-emerald-400">1.0x</span>
          </div>
          <input type="range" id="waveSpeed" min="0.005" max="0.05" step="0.005" value="0.02" class="w-full">
        </div>

        <!-- Wave Height (Amplitude) -->
        <div class="space-y-2">
          <div class="flex justify-between">
            <label class="text-sm font-medium text-slate-300">Wave Amplitude</label>
            <span id="ampVal" class="text-xs font-bold text-emerald-400">150</span>
          </div>
          <input type="range" id="waveAmp" min="50" max="400" step="10" value="150" class="w-full">
        </div>

        <!-- Frequency -->
        <div class="space-y-2">
          <div class="flex justify-between">
            <label class="text-sm font-medium text-slate-300">Wave Frequency</label>
            <span id="freqVal" class="text-xs font-bold text-emerald-400">0.005</span>
          </div>
          <input type="range" id="waveFreq" min="0.001" max="0.02" step="0.001" value="0.005" class="w-full">
        </div>

        <!-- Color Gradient Picker -->
        <div class="space-y-3 pt-4 border-t border-white/10">
          <label class="text-sm font-medium text-slate-300">Color Palette</label>
          <div class="grid grid-cols-3 gap-2">
            <button class="palette-btn h-12 rounded-lg border-2 border-emerald-500 bg-gradient-to-br from-emerald-500 to-teal-800 transition-transform hover:scale-105" data-palette="emerald" title="Emerald Glass"></button>
            <button class="palette-btn h-12 rounded-lg border-2 border-transparent bg-gradient-to-br from-indigo-500 to-purple-800 opacity-60 hover:opacity-100 transition-all hover:scale-105" data-palette="electric" title="Electric Silk"></button>
            <button class="palette-btn h-12 rounded-lg border-2 border-transparent bg-gradient-to-br from-pink-500 to-rose-800 opacity-60 hover:opacity-100 transition-all hover:scale-105" data-palette="neon" title="Deep Neon"></button>
          </div>
        </div>

        <div class="mt-auto space-y-4 pt-6">
          <button id="copyBtn" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-700 text-sm font-medium rounded-lg border border-slate-600 transition-colors flex items-center justify-center gap-2 group">
            <svg class="w-4 h-4 text-slate-400 group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            <span id="copyText">Copy Code Block (Free)</span>
          </button>
          
          <button id="premiumBtn" class="premium-btn w-full py-3 px-4 text-white text-sm font-semibold rounded-lg transition-all flex flex-col items-center justify-center gap-1">
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
              Unlock Premium HD Bundle ($4.99)
            </div>
            <span class="text-[10px] text-amber-100 font-normal opacity-90 text-center">Unlocks infinite looping code, 4K video, & presets.</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Canvas Area -->
    <main class="flex-1 relative bg-slate-900" id="canvasContainer">
      <!-- We will inject the SVG here dynamically to ensure clean extraction -->
      <div id="svgWrapper" class="absolute inset-0 w-full h-full"></div>
    </main>

    <!-- Premium Modal (Hidden by default) -->
    <div id="premiumModal" class="fixed inset-0 z-50 modal-backdrop hidden flex items-center justify-center opacity-0 transition-opacity duration-300">
      <div class="bg-slate-800 border border-slate-600 rounded-2xl p-8 max-w-md w-full shadow-2xl transform scale-95 transition-transform duration-300" id="premiumModalContent">
        <div class="flex justify-between items-start mb-6">
          <h2 class="text-2xl font-bold text-white flex items-center gap-2">
            <svg class="w-6 h-6 text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
            Premium HD Bundle
          </h2>
          <button id="closeModalBtn" class="text-slate-400 hover:text-white transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
        
        <div class="space-y-4 mb-8">
          <div class="flex items-center gap-3 text-slate-300">
            <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span>Infinite raw looping SVG animation code</span>
          </div>
          <div class="flex items-center gap-3 text-slate-300">
            <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span>4K high-res video loops (MP4/WebM)</span>
          </div>
          <div class="flex items-center gap-3 text-slate-300">
            <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span>Desktop live wallpaper presets</span>
          </div>
          <div class="flex items-center gap-3 text-slate-300">
            <svg class="w-5 h-5 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span>Commercial Use License</span>
          </div>
        </div>

        <button class="w-full py-3 bg-white text-slate-900 hover:bg-slate-100 font-bold rounded-lg transition-colors shadow-lg">
          Pay $4.99 Securely
        </button>
        <p class="text-center text-xs text-slate-500 mt-4">Simulated Checkout • No actual payment required</p>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
